name: Release Spiritty

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: spiritty-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name: spiritty-aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: spiritty-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: spiritty-aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (Release)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary archive
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/spiritty"
          
          # Strip debug symbols on Unix
          if [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
            if [ "${{ matrix.use_cross }}" = "true" ]; then
              aarch64-linux-gnu-strip "$BIN_PATH" 2>/dev/null || true
            else
              strip "$BIN_PATH" 2>/dev/null || true
            fi
          elif [[ "${{ matrix.os }}" == *"macos"* ]]; then
            strip "$BIN_PATH" 2>/dev/null || true
          fi

          mkdir -p dist
          cp "$BIN_PATH" dist/spiritty
          cp README.md dist/
          cp LICENSE* dist/ 2>/dev/null || true

          cd dist
          tar -czf "../${{ matrix.archive_name }}.tar.gz" spiritty README.md
          cd ..
          shasum -a 256 "${{ matrix.archive_name }}.tar.gz" > "${{ matrix.archive_name }}.tar.gz.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}.tar.gz
            ${{ matrix.archive_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
